<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NGO Directory — NGO Connect</title>
  <meta name="description" content="Discover and connect with verified Non-Governmental Organisations. Search by name, city, or state and create Google Meet calls instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

<!-- ── Nav ───────────────────────────────────────────────── -->
<nav class="dir-nav">
  <a href="index.html" class="dir-nav-brand">
    <span style="font-size:22px;">🤝</span>
    <span>NGO Connect</span>
  </a>
  <div class="dir-nav-actions">
    <a href="index.html" class="btn btn-ghost btn-sm">
      <i class="bi bi-grid-1x2"></i> Dashboard
    </a>
  </div>
</nav>

<!-- ── Hero / Search ─────────────────────────────────────── -->
<div class="dir-hero">
  <h1>NGO Directory</h1>
  <p>Discover and connect with verified Non-Governmental Organisations across India</p>
  <div class="dir-search-bar">
    <input type="search" id="dirSearch"
           placeholder="🔍  Search by name, city, or state…"
           autocomplete="off" spellcheck="false">
  </div>
</div>

<!-- ── Container ─────────────────────────────────────────── -->
<div class="dir-container">

  <!-- Stats row -->
  <div class="dir-meta">
    <div class="dir-stat">
      <strong id="statTotal">—</strong>
      Registered Organisations
    </div>
    <div class="dir-stat">
      <strong id="statCities">—</strong>
      Cities
    </div>
    <div class="dir-stat">
      <strong id="statShowing">—</strong>
      Showing
    </div>
  </div>

  <!-- Cards grid -->
  <div class="dir-grid" id="ngoGrid">
    <div class="empty" style="grid-column:1/-1;">
      <div class="empty-icon">⏳</div>
      <p>Loading directory…</p>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast-container" id="toasts"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/quotes.js"></script>
<script src="js/ai-widget.js"></script>
<script src="js/directory.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    Directory.init();
    AIWidget.init();
  });
</script>

</body>
</html>
